name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r techshop-ecommerce/techshop-backend/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: techshop-ecommerce/techshop-backend
      - run: python -m unittest discover -s tests -v
        working-directory: devconnect-social/devconnect-backend
      - run: python -m unittest discover -s tests -v
        working-directory: taskflow-productivity/taskflow-backend
